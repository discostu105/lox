[package]
name = "lxir"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Loxone config-as-code: a text language compiled to .Loxone configs — lossless XML core, UUID/identity model, lockfile, compile/decompile/adopt, semantic diff, simulated tests"
repository = "https://github.com/discostu105/lox"
readme = "README.md"
keywords = ["loxone", "home-automation", "smart-home", "compiler", "config"]
categories = ["command-line-utilities", "parser-implementations"]
license = "Apache-2.0"
# Dev-only trees stay out of the package (the corpus is gitignored anyway).
exclude = ["/corpus", "/docs/data", "/tools", "/scripts", "/.github", "/AGENTS.md"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
