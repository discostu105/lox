[package]
name = "lxir"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Loxone config-as-code: a text language compiled to .Loxone configs — lossless XML core, UUID/identity model, lockfile, compile/decompile/adopt, semantic diff, simulated tests"
repository = "https://github.com/discostu105/lox"
readme = "README.md"
keywords = ["loxone", "home-automation", "smart-home", "compiler", "config"]
categories = ["command-line-utilities", "parser-implementations"]
license = "Apache-2.0"
# Dev-only trees stay out of the package (the corpus is gitignored anyway).
exclude = ["/corpus", "/docs/data", "/tools", "/scripts", "/.github", "/AGENTS.md"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
# `archive`: backup ZIPs and the LoxCC codec (Loxone writes deflate only)
zip = { version = "2", default-features = false, features = ["deflate"], optional = true }
lz4_flex = { version = "0.13", default-features = false, features = ["std", "safe-encode", "safe-decode"], optional = true }
crc32fast = { version = "1", optional = true }

[features]
default = ["archive"]
# Read and write Miniserver backup ZIPs (`sps0.LoxCC`); without it lxir
# reads plain `.Loxone` XML only.
archive = ["dep:zip", "dep:lz4_flex", "dep:crc32fast"]
