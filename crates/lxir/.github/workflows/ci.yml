name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release
      - name: check path on the shipped example
        env:
          LXIR: target/release/lxir
          BASE: examples/configs/haus.Loxone
          MODULE: examples/ir/beschattung.lxir
          LOCK: examples/out/beschattung.lock.json
          EXPECTED: examples/out/haus-compiled.Loxone
        run: examples/ci.sh
      - name: check path on the shipped project example
        env:
          LXIR: target/release/lxir
          BASE: examples/configs/pool.Loxone
          MODULE: examples/project/pages
          LOCK: examples/project/pool.lock.json
          EXPECTED: examples/project/out.Loxone
        run: examples/ci.sh
