[package]
name = "loxone-client"
version = "0.1.3"
edition = "2024"
rust-version = "1.91"
description = "Client for the Loxone Miniserver: HTTP API, token auth (RSA/AES key exchange), WebSocket state stream, FTP backups, statistics"
repository = "https://github.com/discostu105/lox"
readme = "README.md"
keywords = ["loxone", "miniserver", "home-automation", "smart-home", "websocket"]
categories = ["api-bindings", "network-programming"]
license = "Apache-2.0"

[dependencies]
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls-manual-roots"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["net", "time", "sync", "macros", "rt"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake", "rustls-tls-native-roots"] }
futures-util = "0.3"
rustls = { version = "0.23", default-features = false, features = ["logging", "ring", "std", "tls12"] }
webpki-roots = "0.26"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
rsa = { version = "0.9", features = ["sha2"] }
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["clock"] }
byteorder = "1"
suppaftp = "6"

[dev-dependencies]
httpmock = "0.7"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
