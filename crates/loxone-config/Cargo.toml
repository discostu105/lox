[package]
name = "loxone-config"
version = "0.15.0"
edition = "2024"
rust-version = "1.88"
description = "The Loxone Config program file as a library — lossless .Loxone model, UUIDs, backup ZIPs, semantic diff — and Lox Logic, a text language compiled into it (compile/decompile/adopt, lockfile, simulated tests)"
repository = "https://github.com/discostu105/lox"
readme = "README.md"
keywords = ["loxone", "home-automation", "smart-home", "compiler", "config"]
categories = ["command-line-utilities", "parser-implementations"]
license = "Apache-2.0"
# Dev-only trees stay out of the package (the corpus is gitignored anyway).
exclude = ["/corpus", "/docs/data", "/tools", "/scripts", "/.github", "/AGENTS.md"]

# The Lox Logic toolchain; `lox logic` runs the same CLI.
[[bin]]
name = "loxl"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
# `archive`: backup ZIPs and the LoxCC codec (Loxone writes deflate only)
zip = { version = "2", default-features = false, features = ["deflate"], optional = true }
lz4_flex = { version = "0.13", default-features = false, features = ["std", "safe-encode", "safe-decode"], optional = true }
crc32fast = { version = "1", optional = true }

[features]
default = ["archive"]
# Read and write Miniserver backup ZIPs (`sps0.LoxCC`); without it the crate
# reads plain `.Loxone` XML only.
archive = ["dep:zip", "dep:lz4_flex", "dep:crc32fast"]
