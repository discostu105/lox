name: Corpus

# The public corpus of real Loxone configs (crates/loxone-config/tools/
# corpus-manifest.json) and the pinned external references
# (docs/references.json). Neither is committed — most of it carries no
# license to redistribute — so this job downloads them, verifies their
# hashes and runs the corpus tests. Weekly, and on demand.

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "crates/loxone-config/tools/fetch-corpus.py"
      - "crates/loxone-config/tools/corpus-manifest.json"
      - "tools/fetch-refs.py"
      - "docs/references.json"
      - ".github/workflows/corpus.yml"

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  corpus:
    name: Corpus tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # Keyed on the manifest: the sources are fetched once per manifest
      # version, not every week.
      - name: Cache corpus
        uses: actions/cache@v6
        with:
          path: crates/loxone-config/corpus/web
          key: corpus-${{ hashFiles('crates/loxone-config/tools/corpus-manifest.json') }}

      - name: Fetch and verify the corpus
        working-directory: crates/loxone-config
        run: python3 -I tools/fetch-corpus.py corpus/web

      - name: Corpus tests
        working-directory: crates/loxone-config
        env:
          LOXL_CORPUS: corpus/web
        run: cargo test --release -p loxone-config --test corpus --test roundtrip --no-fail-fast

  references:
    name: Reference drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Exit 1 when Loxone republished a pinned document: re-read it,
      # carry what changed into our docs, then `tools/fetch-refs.py --update`.
      - name: Check pinned references
        run: python3 -I tools/fetch-refs.py --check
