name: Auto-release

# Every push to main that passes CI is released: bump the version, write
# the changelog fragments (changelog.d/) into CHANGELOG.md under it, commit
# "Release vX.Y.Z", tag, then build and publish exactly like a pushed tag
# (release.yml).
#
# How big a bump, and whether to release at all, is decided by
# .github/scripts/prepare_release.py: PR labels release:major,
# release:minor, release:patch, no-release (or the same words in brackets
# in a direct commit's message); without a release:* label, minor when
# there is an "added" entry, else patch; nothing for docs/CI-only changes.
#
# Pushes made with GITHUB_TOKEN (the release commit, the tag, the
# Homebrew formula update) trigger no workflows, so nothing here loops
# and release.yml runs once, called below.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Version, changelog, tag
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      tag: ${{ steps.push.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      # Only the newest green commit releases: if main moved on, the CI run
      # of the newer commit releases this one along with it. Commits the
      # release flow pushed itself (the Homebrew formula, "Release vX.Y.Z")
      # start no CI run, so they don't count: a merge that lands while a
      # release is running would otherwise wait for the next merge.
      - name: Still the head of main?
        id: head
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          newer=$(git log --format=%an "$SHA..HEAD" | grep -cv '^github-actions\[bot\]$' || true)
          if git merge-base --is-ancestor "$SHA" HEAD && [ "$newer" = 0 ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main moved on past $SHA; the next CI run releases it"
          fi

      - name: Decide and prepare
        id: prepare
        if: steps.head.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/prepare_release.py

      - name: Commit, tag, push
        id: push
        if: steps.prepare.outputs.tag != ''
        env:
          TAG: ${{ steps.prepare.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "Release $TAG"
          git tag "$TAG"
          if git push --atomic origin HEAD:refs/heads/main "refs/tags/$TAG"; then
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main moved on while preparing $TAG; the next CI run releases"
          fi

  release:
    name: Release
    needs: prepare
    if: needs.prepare.outputs.tag != ''
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
    secrets: inherit
    permissions:
      contents: write
      packages: write
