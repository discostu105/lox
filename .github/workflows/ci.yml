name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: fmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy -- -D warnings

      - name: clippy (lxir, all targets)
        run: cargo clippy -p lxir --all-targets -- -D warnings

      # On PRs only: an entry under [Unreleased] goes wrong when the PR is
      # merged; on main the release still picks it up.
      - name: Changelog fragments
        if: github.event_name == 'pull_request'
        run: python3 .github/scripts/prepare_release.py --check

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: build
        run: cargo build --release

      - name: test
        run: cargo test --release

      # lxir's CI check path (crates/lxir/examples/ci.sh) on the shipped
      # examples: validate, canonical format, lock currency, determinism,
      # byte-identical expected output.
      - name: lxir check path (example module)
        if: runner.os == 'Linux'
        env:
          LXIR: target/release/lxir
          BASE: crates/lxir/examples/configs/haus.Loxone
          MODULE: crates/lxir/examples/ir/beschattung.lxir
          LOCK: crates/lxir/examples/out/beschattung.lock.json
          EXPECTED: crates/lxir/examples/out/haus-compiled.Loxone
        run: crates/lxir/examples/ci.sh

      - name: lxir check path (example project)
        if: runner.os == 'Linux'
        env:
          LXIR: target/release/lxir
          BASE: crates/lxir/examples/configs/pool.Loxone
          MODULE: crates/lxir/examples/project/pages
          LOCK: crates/lxir/examples/project/pool.lock.json
          EXPECTED: crates/lxir/examples/project/out.Loxone
        run: crates/lxir/examples/ci.sh

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin

      # --engine llvm: the CLI tests (tests/cli_smoke.rs) run the lox binary
      # as a subprocess; without its coverage codecov/patch fails PRs whose
      # code is tested only that way. The llvm engine instruments that binary
      # too. The ptrace engine's --follow-exec segfaulted in the lxir tests
      # that spawn lxir.
      - name: Generate coverage
        run: cargo tarpaulin --engine llvm --out xml --output-dir coverage --root ${{ github.workspace }}

      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage/cobertura.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
