name: Release

# Builds and publishes a tagged version: binaries on the GitHub release,
# the Docker image, the Homebrew formula, and lxir on crates.io when its
# version is new. Runs for a pushed vX.Y.Z tag, when auto-release.yml calls
# it after tagging, or by hand for an existing tag (to retry a failed run).
on:
  push:
    tags:
      - "v*"
  workflow_call:
    inputs:
      tag:
        description: The tag to release (vX.Y.Z), already pushed
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and release, e.g. v0.15.0
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            artifact: lox-linux-x86_64
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            artifact: lox-linux-aarch64
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: lox-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: lox-macos-aarch64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: lox-windows-x86_64
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            artifact: lox-windows-aarch64

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cargo-zigbuild (Linux musl)
        if: contains(matrix.target, 'linux-musl')
        run: |
          pip install ziglang
          cargo install cargo-zigbuild --locked

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Build (zigbuild for musl)
        if: contains(matrix.target, 'linux-musl')
        run: cargo zigbuild --release --target ${{ matrix.target }}

      - name: Build
        if: ${{ !contains(matrix.target, 'linux-musl') }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary (Unix)
        if: runner.os != 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/lox ${{ matrix.artifact }}

      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/lox.exe ${{ matrix.artifact }}.exe

      - name: SHA256 checksum (Unix)
        if: runner.os != 'Windows'
        run: |
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum ${{ matrix.artifact }} > ${{ matrix.artifact }}.sha256
          else
            shasum -a 256 ${{ matrix.artifact }} > ${{ matrix.artifact }}.sha256
          fi

      - name: SHA256 checksum (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $hash = (Get-FileHash "${{ matrix.artifact }}.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.artifact }}.exe" | Out-File -Encoding ascii "${{ matrix.artifact }}.exe.sha256"

      - name: Upload artifacts (Unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sha256

      - name: Upload artifacts (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.exe
            ${{ matrix.artifact }}.exe.sha256

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: lox-*
          merge-multiple: true

      # The CHANGELOG section of this version in the release style (title
      # "vX.Y.Z — tagline", emoji headings), above GitHub's list of PRs
      - name: Release notes
        id: notes
        run: python3 .github/scripts/prepare_release.py --notes "$TAG" > release-notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ steps.notes.outputs.name }}
          files: artifacts/*
          body_path: release-notes.md
          generate_release_notes: true

  docker:
    name: Push Docker image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Download Linux artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: lox-*
          merge-multiple: true

      - name: Prepare binaries
        run: |
          mkdir -p docker/linux/amd64 docker/linux/arm64
          cp artifacts/lox-linux-x86_64 docker/linux/amd64/lox
          cp artifacts/lox-linux-aarch64 docker/linux/arm64/lox
          chmod +x docker/linux/amd64/lox docker/linux/arm64/lox

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  update-homebrew:
    name: Update Homebrew Formula
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: lox-*
          merge-multiple: true

      - name: Update formula with checksums
        run: |
          VERSION="${TAG#v}"
          export SHA_MACOS_ARM=$(awk '{print $1}' artifacts/lox-macos-aarch64.sha256)
          export SHA_MACOS_X86=$(awk '{print $1}' artifacts/lox-macos-x86_64.sha256)
          export SHA_LINUX_ARM=$(awk '{print $1}' artifacts/lox-linux-aarch64.sha256)
          export SHA_LINUX_X86=$(awk '{print $1}' artifacts/lox-linux-x86_64.sha256)

          sed -i "s/^  version \".*\"/  version \"${VERSION}\"/" Formula/lox.rb

          # Update SHA256 values in order of appearance:
          # 1st = macos-aarch64, 2nd = macos-x86_64,
          # 3rd = linux-aarch64, 4th = linux-x86_64
          python3 - <<'PYEOF'
          import re, os

          sha_map = [
              os.environ["SHA_MACOS_ARM"],
              os.environ["SHA_MACOS_X86"],
              os.environ["SHA_LINUX_ARM"],
              os.environ["SHA_LINUX_X86"],
          ]

          with open("Formula/lox.rb") as f:
              content = f.read()

          idx = [0]
          def replacer(m):
              i = idx[0]
              idx[0] += 1
              return f'sha256 "{sha_map[i]}"'

          content = re.sub(r'sha256 "[^"]*"', replacer, content)

          with open("Formula/lox.rb", "w") as f:
              f.write(content)
          PYEOF

      - name: Commit updated formula
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/lox.rb
          if git diff --cached --quiet; then
            echo "Formula already at ${TAG}"
            exit 0
          fi
          git commit -m "brew: update formula to ${TAG}"
          # A PR merged meanwhile must not fail the release
          git pull --rebase origin main
          git push origin main

  publish-lxir:
    name: Publish lxir to crates.io (new versions only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # lxir keeps its own version (crates/lxir/Cargo.toml); bump it there
      # and the next release publishes it.
      - name: Publish if crates.io lacks this version
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "lxir") | .version')
          if curl -fsS -o /dev/null -A "lox release (github.com/${GITHUB_REPOSITORY})" \
               "https://crates.io/api/v1/crates/lxir/${version}"; then
            echo "lxir ${version} is on crates.io already"
          elif [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::warning::lxir ${version} is not on crates.io, and there is no CARGO_REGISTRY_TOKEN secret to publish it"
          else
            cargo publish -p lxir --locked
          fi
