name: Audit

# Checks Cargo.lock against the RustSec advisory database: when the lockfile
# changes, and daily, because advisories appear without a change here.
# Accepted advisories and the reasons are in .cargo/audit.toml.
on:
  push:
    branches: ["main"]
    paths: ["**/Cargo.toml", "Cargo.lock", ".cargo/audit.toml", ".github/workflows/audit.yml"]
  pull_request:
    branches: ["main"]
    paths: ["**/Cargo.toml", "Cargo.lock", ".cargo/audit.toml", ".github/workflows/audit.yml"]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo-audit
        id: cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-cargo-audit-0.23

      - name: Install cargo-audit
        if: steps.cache.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --version ^0.23 --locked

      - name: cargo audit
        run: cargo audit --deny warnings
