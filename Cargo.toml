[workspace]
members = [".", "crates/loxone-config", "crates/loxone-client"]
# Plain `cargo build/test/clippy` cover all crates.
default-members = [".", "crates/loxone-config", "crates/loxone-client"]

[package]
name = "lox"
version = "0.51.0"
edition = "2024"
rust-version = "1.91"
description = "Loxone Miniserver CLI — control lights, blinds, and more from your terminal"
repository = "https://github.com/discostu105/lox"
homepage = "https://github.com/discostu105/lox"
keywords = ["loxone", "smarthome", "home-automation", "cli", "miniserver"]
categories = ["command-line-utilities", "network-programming"]
license = "Apache-2.0"
readme = "README.md"
# The crates.io name `lox` belongs to another project; lox ships as release
# binaries and through Homebrew.
publish = false
default-run = "lox"

[[bin]]
name = "lox"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env", "suggestions"] }
clap_complete = "4"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls-manual-roots"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
dirs = "5"
anyhow = "1"

# The Miniserver client (HTTP, token auth, WebSocket, FTP) is crates/loxone-client
tokio = { version = "1", features = ["full"] }
sha2 = "0.10"
hex = "0.4"
futures-util = "0.3"
base64 = "0.22"
chrono = { version = "0.4", features = ["clock"] }
uuid = { version = "1", features = ["v4"] }
# hidden prompt for `lox user code set`
rpassword = "7"

# MCP server (`lox mcp`)
rmcp = { version = "3.5", default-features = false, features = ["server", "macros", "transport-io", "elicitation"] }
schemars = "1"

# OpenTelemetry deps
opentelemetry = { version = "0.31", default-features = false, features = ["metrics", "logs", "trace"] }
opentelemetry_sdk = { version = "0.31", default-features = false, features = ["metrics", "logs", "trace", "rt-tokio", "experimental_metrics_periodicreader_with_async_runtime"] }
opentelemetry-http = { version = "0.31", default-features = false, features = ["reqwest"] }
opentelemetry-otlp = { version = "0.31", default-features = false, features = ["metrics", "logs", "trace", "http-proto", "reqwest-blocking-client"] }

# Backup deps
quick-xml = "0.37"
crc32fast = "1"
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "underline-color"], optional = true }
crossterm = { version = "0.29", features = ["event-stream"], optional = true }
nucleo-matcher = { version = "0.3", optional = true }
loxone-config = { path = "crates/loxone-config", version = "0.5.0" }
loxone-client = { path = "crates/loxone-client", version = "0.1.2" }
unicode-width = { version = "0.2", optional = true }
unicode-segmentation = { version = "1", optional = true }
libc = { version = "0.2", optional = true }

[dev-dependencies]
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake", "rustls-tls-native-roots"] }
byteorder = "1"
# MCP client side for protocol tests of `lox mcp`
rmcp = { version = "3.5", default-features = false, features = ["client", "server", "macros", "transport-io", "elicitation"] }
assert_cmd = "2"
predicates = "3"
tempfile = "3"
httpmock = "0.7"
tokio-test = "0.4"
# paused clock for the timeouts of `lox access learn`
tokio = { version = "1", features = ["test-util"] }
insta = "1"
# building backup ZIPs in tests (loxone_config::archive reads and stages them)
zip = "2"
portable-pty = "0.9"

[features]
default = ["tui"]
# Interactive terminal UI (`lox tui`). Disable with --no-default-features for a minimal build.
tui = ["dep:ratatui", "dep:crossterm", "dep:nucleo-matcher", "dep:unicode-width", "dep:unicode-segmentation", "dep:libc"]
